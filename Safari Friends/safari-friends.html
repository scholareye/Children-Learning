<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safari Friends — Learn Animal Names</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#FDEBD3;
    --sky-bottom:#FBCB8B;
    --hill-1:#E3B23C;
    --hill-2:#C9932A;
    --hill-3:#AD7B22;
    --teal:#2A7F76;
    --teal-dark:#1E5E57;
    --ink:#3B2E1F;
    --card:#FFFFFF;
    --card-edge:#EFE0C3;
    --correct:#2A7F76;
    --wrong:#C1502E;
    font-family:'Nunito', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 60%, var(--sky-bottom) 100%);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  .sun{
    position:absolute; top:-50px; left:-40px; width:190px; height:190px;
    background: radial-gradient(circle at 40% 35%, #FFF3D6, #FFD873 70%);
    border-radius:50%;
    box-shadow: 0 0 0 12px rgba(255,216,115,0.2);
    z-index:0;
  }
  .bird{
    position:absolute; z-index:0; opacity:0.55;
  }
  header{
    position:relative; z-index:1;
    padding: 44px 24px 18px;
    text-align:center;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    margin:0;
    color:var(--ink);
  }
  h1 span{ color: var(--teal-dark); }
  .subtitle{
    font-size:1.05rem;
    max-width:480px;
    margin:10px auto 0;
    color:#5A4A32;
    font-weight:700;
  }
  nav.modes{
    position:relative; z-index:1;
    display:flex; justify-content:center; gap:14px;
    margin: 22px 0 6px;
    flex-wrap:wrap;
  }
  .mode-btn{
    font-family:'Baloo 2', sans-serif;
    font-size:1.05rem; font-weight:600;
    padding:12px 26px;
    border-radius:999px;
    border:3px solid var(--teal-dark);
    background:#fff;
    color:var(--teal-dark);
    cursor:pointer;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .mode-btn:hover{ transform: translateY(-2px); }
  .mode-btn.active{
    background:var(--teal-dark);
    color:#fff;
  }
  main{
    position:relative; z-index:1;
    max-width:980px;
    margin:0 auto;
    padding: 18px 20px 40px;
  }

  /* ---- Explore grid ---- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap:18px;
    margin-top: 20px;
  }
  .animal-card{
    background:var(--card);
    border:2px solid var(--card-edge);
    border-radius:20px;
    padding:14px 10px 16px;
    text-align:center;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .animal-card:nth-child(odd){ transform: rotate(-1.2deg); }
  .animal-card:nth-child(even){ transform: rotate(1.2deg); }
  .animal-card:hover{
    transform: translateY(-4px) rotate(0deg) scale(1.03);
    box-shadow: 0 10px 20px rgba(59,46,31,0.14);
  }
  .animal-card svg{ width:88px; height:88px; }
  .animal-card .name{
    font-family:'Baloo 2', sans-serif;
    font-weight:600;
    font-size:1.05rem;
    margin-top:6px;
  }

  /* ---- Detail panel ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(59,46,31,0.45);
    display:none; align-items:center; justify-content:center;
    z-index:10; padding:20px;
  }
  .overlay.open{ display:flex; }
  .detail-card{
    background:#fff; border-radius:28px; padding:32px 28px 28px;
    max-width:360px; width:100%; text-align:center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    position:relative;
  }
  .detail-card svg{ width:150px; height:150px; }
  .detail-card .name{
    font-family:'Baloo 2', sans-serif;
    font-size:1.8rem; font-weight:700; margin:6px 0 2px;
  }
  .detail-card .fact{
    font-size:1rem; color:#5A4A32; margin: 10px 0 16px; line-height:1.4;
  }
  .btn-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .say-btn, .sound-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:600; font-size:0.95rem;
    border:none; border-radius:999px;
    padding:12px 20px; cursor:pointer;
  }
  .say-btn{ background:#FFD873; box-shadow: 0 4px 0 #E0B94D; }
  .sound-btn{ background:var(--teal); color:#fff; box-shadow: 0 4px 0 var(--teal-dark); }
  .say-btn:active, .sound-btn:active{ transform: translateY(2px); box-shadow:none; }
  .close-btn{
    position:absolute; top:14px; right:16px;
    background:none; border:none; font-size:1.4rem; cursor:pointer;
    color:#B0A48A;
    font-family:'Nunito', sans-serif;
  }

  /* ---- Quiz ---- */
  .quiz-wrap{ text-align:center; margin-top:10px; }
  .quiz-progress{
    font-weight:800; color:#5A4A32; margin-bottom:6px;
  }
  .quiz-stage{
    background:var(--card);
    border:2px solid var(--card-edge);
    border-radius:26px;
    padding:26px 20px;
    max-width:380px;
    margin: 12px auto 22px;
  }
  .quiz-stage svg{ width:150px; height:150px; }
  .quiz-question{
    font-family:'Baloo 2', sans-serif;
    font-size:1.15rem; font-weight:600; margin-top:8px;
  }
  .answers{
    display:grid; grid-template-columns: 1fr 1fr;
    gap:12px; max-width:420px; margin:0 auto;
  }
  .answer-btn{
    font-family:'Baloo 2', sans-serif;
    font-size:1rem; font-weight:600;
    padding:14px 10px;
    border-radius:16px;
    border:2.5px solid var(--card-edge);
    background:#fff;
    cursor:pointer;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
  }
  .answer-btn:hover{ transform: translateY(-2px); }
  .answer-btn.correct{ background:#E1F0EE; border-color:var(--correct); color:var(--teal-dark); }
  .answer-btn.wrong{ background:#FBE4DC; border-color:var(--wrong); color:#8F3A1F; }
  .answer-btn[disabled]{ cursor:default; }
  .quiz-feedback{
    min-height:28px; margin-top:14px; font-weight:800;
    font-family:'Baloo 2', sans-serif;
  }
  .quiz-feedback.correct{ color:var(--teal-dark); }
  .quiz-feedback.wrong{ color:var(--wrong); }
  .quiz-done{ max-width:380px; margin:0 auto; }
  .quiz-done .score{
    font-family:'Baloo 2', sans-serif; font-size:2.4rem; font-weight:700;
    color:var(--teal-dark);
  }
  .restart-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:600; font-size:1rem;
    margin-top:16px;
    background:var(--teal-dark); color:#fff; border:none; border-radius:999px;
    padding:12px 28px; cursor:pointer;
  }
  .hidden{ display:none !important; }
  .hills{
    position:relative; z-index:1; height:90px; margin-top:10px; overflow:hidden;
  }
  .hills .h1,.hills .h2,.hills .h3{
    position:absolute; bottom:-30px; width:60%; height:120px; border-radius:50%;
  }
  .hills .h1{ left:-10%; background:var(--hill-3); }
  .hills .h2{ left:25%; background:var(--hill-2); width:70%; }
  .hills .h3{ left:55%; background:var(--hill-1); width:60%; }
</style>
</head>
<body>

<div class="sun"></div>
<svg class="bird" style="top:60px; left:20%;" width="34" height="16" viewBox="0 0 34 16"><path d="M2 10 Q9 0 17 10 Q25 0 32 10" stroke="#3B2E1F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
<svg class="bird" style="top:90px; left:70%;" width="26" height="12" viewBox="0 0 34 16"><path d="M2 10 Q9 0 17 10 Q25 0 32 10" stroke="#3B2E1F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>

<header>
  <h1>Welcome to <span>Safari Friends</span></h1>
  <p class="subtitle">Tap an animal to meet it, hear its name, and hear the sound it makes!</p>
</header>

<nav class="modes">
  <button class="mode-btn active" id="btn-explore">🦁 Explore</button>
  <button class="mode-btn" id="btn-quiz">🎯 Quiz Time</button>
</nav>

<main>
  <section id="explore-section">
    <div class="grid" id="animal-grid"></div>
  </section>

  <section id="quiz-section" class="hidden">
    <div class="quiz-wrap">
      <div class="quiz-progress" id="quiz-progress"></div>

      <div id="quiz-active">
        <div class="quiz-stage">
          <div id="quiz-illustration"></div>
          <div class="quiz-question">What's this animal called?</div>
        </div>
        <div class="answers" id="quiz-answers"></div>
        <div class="quiz-feedback" id="quiz-feedback"></div>
      </div>

      <div id="quiz-done" class="quiz-done hidden">
        <div class="score" id="quiz-score"></div>
        <div id="quiz-done-msg"></div>
        <button class="restart-btn" id="quiz-restart">Play again</button>
      </div>
    </div>
  </section>
</main>

<div class="hills"><div class="h1"></div><div class="h2"></div><div class="h3"></div></div>

<div class="overlay" id="overlay">
  <div class="detail-card">
    <button class="close-btn" id="close-detail">✕</button>
    <div id="detail-illustration"></div>
    <div class="name" id="detail-name"></div>
    <div class="fact" id="detail-fact"></div>
    <div class="btn-row">
      <button class="say-btn" id="say-btn">🔊 Say name</button>
      <button class="sound-btn" id="sound-btn">🐾 Animal sound</button>
    </div>
  </div>
</div>

// ---------- Explore grid ----------
const grid = document.getElementById('animal-grid');
ANIMALS.forEach(a=>{
  const card = document.createElement('div');
  card.className = 'animal-card';
  card.innerHTML = `${a.svg}<div class="name">${a.name}</div>`;
  card.addEventListener('click', ()=> openDetail(a));
  grid.appendChild(card);
});

const overlay = document.getElementById('overlay');
const detailIllustration = document.getElementById('detail-illustration');
const detailName = document.getElementById('detail-name');
const detailFact = document.getElementById('detail-fact');
let currentAnimal = null;

function openDetail(a){
  currentAnimal = a;
  detailIllustration.innerHTML = a.svg;
  detailName.textContent = a.name;
  detailFact.textContent = a.fact;
  overlay.classList.add('open');
}
document.getElementById('close-detail').addEventListener('click', ()=> overlay.classList.remove('open'));
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('open'); });

document.getElementById('say-btn').addEventListener('click', ()=>{
  if(!currentAnimal) return;
  speak(currentAnimal.name);
});
document.getElementById('sound-btn').addEventListener('click', ()=>{
  if(!currentAnimal) return;
  speak(currentAnimal.sound);
});

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.85;
  utter.pitch = 1.1;
  utter.lang = 'en-US';
  window.speechSynthesis.speak(utter);
}

// ---------- Mode switching ----------
const btnExplore = document.getElementById('btn-explore');
const btnQuiz = document.getElementById('btn-quiz');
const exploreSection = document.getElementById('explore-section');
const quizSection = document.getElementById('quiz-section');

btnExplore.addEventListener('click', ()=>{
  btnExplore.classList.add('active'); btnQuiz.classList.remove('active');
  exploreSection.classList.remove('hidden'); quizSection.classList.add('hidden');
});
btnQuiz.addEventListener('click', ()=>{
  btnQuiz.classList.add('active'); btnExplore.classList.remove('active');
  quizSection.classList.remove('hidden'); exploreSection.classList.add('hidden');
  if(quizOrder.length === 0) startQuiz();
});

// ---------- Quiz ----------
const QUIZ_LENGTH = 8;
let quizOrder = [];
let quizIndex = 0;
let quizScore = 0;
let answered = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz(){
  quizOrder = shuffle(ANIMALS).slice(0, QUIZ_LENGTH);
  quizIndex = 0;
  quizScore = 0;
  document.getElementById('quiz-active').classList.remove('hidden');
  document.getElementById('quiz-done').classList.add('hidden');
  renderQuizQuestion();
}

function renderQuizQuestion(){
  answered = false;
  const a = quizOrder[quizIndex];
  document.getElementById('quiz-progress').textContent = `Question ${quizIndex+1} of ${QUIZ_LENGTH} · Score: ${quizScore}`;
  document.getElementById('quiz-illustration').innerHTML = a.svg;
  document.getElementById('quiz-feedback').textContent = '';
  document.getElementById('quiz-feedback').className = 'quiz-feedback';

  const others = shuffle(ANIMALS.filter(x=>x.id!==a.id)).slice(0,3);
  const options = shuffle([a, ...others]);

  const answersDiv = document.getElementById('quiz-answers');
  answersDiv.innerHTML = '';
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = opt.name;
    btn.addEventListener('click', ()=> handleAnswer(btn, opt, a));
    answersDiv.appendChild(btn);
  });
}

function handleAnswer(btn, chosen, correctAnimal){
  if(answered) return;
  answered = true;
  const feedback = document.getElementById('quiz-feedback');
  const allBtns = document.querySelectorAll('.answer-btn');

  if(chosen.id === correctAnimal.id){
    quizScore++;
    btn.classList.add('correct');
    feedback.textContent = 'Yes! Great job! 🌟';
    feedback.className = 'quiz-feedback correct';
    speak(correctAnimal.name);
  } else {
    btn.classList.add('wrong');
    feedback.textContent = `Not quite — that's a ${correctAnimal.name}.`;
    feedback.className = 'quiz-feedback wrong';
    allBtns.forEach(b=>{ if(b.textContent === correctAnimal.name) b.classList.add('correct'); });
  }
  allBtns.forEach(b=> b.disabled = true);

  setTimeout(()=>{
    quizIndex++;
    if(quizIndex < QUIZ_LENGTH){
      renderQuizQuestion();
    } else {
      finishQuiz();
    }
  }, 1400);
}

function finishQuiz(){
  document.getElementById('quiz-active').classList.add('hidden');
  document.getElementById('quiz-done').classList.remove('hidden');
  document.getElementById('quiz-progress').textContent = '';
  document.getElementById('quiz-score').textContent = `${quizScore} / ${QUIZ_LENGTH}`;
  let msg = 'Nice try — explore more animals and play again!';
  if(quizScore === QUIZ_LENGTH) msg = 'Perfect score! You know your animals! 🥳';
  else if(quizScore >= QUIZ_LENGTH*0.7) msg = 'Great job! You know a lot of animals! 🎉';
  document.getElementById('quiz-done-msg').textContent = msg;
}

document.getElementById('quiz-restart').addEventListener('click', startQuiz);
</script>
